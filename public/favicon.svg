<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Cyber Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d06" />
      <stop offset="50%" stop-color="#08180e" />
      <stop offset="100%" stop-color="#020804" />
    </linearGradient>

    <!-- Neon Emerald to Cyan Gradient -->
    <linearGradient id="ubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Cyber Shield Outer Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Container -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3.5" />
  
  <!-- Outer Cyber Tech Corner Dots -->
  <circle cx="22" cy="22" r="3" fill="#22c55e" opacity="0.8" />
  <circle cx="106" cy="22" r="3" fill="#22c55e" opacity="0.8" />
  <circle cx="22" cy="106" r="3" fill="#00f2fe" opacity="0.8" />
  <circle cx="106" cy="106" r="3" fill="#00f2fe" opacity="0.8" />
  
  <!-- Cyber Shield Badge Outline -->
  <path d="M64 16 L98 32 V62 C98 85 82 102 64 110 C46 102 30 85 30 62 V32 Z" fill="#06140a" stroke="url(#ubGrad)" stroke-width="2.5" stroke-linejoin="round" opacity="0.85" />

  <!-- Monogram "UB" (Futuristic Sharp Typography) -->
  <!-- "U" - Left Side -->
  <path d="M 43 42 V 68 C 43 78 49 84 57 84 C 64 84 66 80 66 75" fill="none" stroke="url(#ubGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
  
  <!-- "B" - Right Side -->
  <path d="M 65 42 H 81 C 87 42 91 46.5 91 52 C 91 57.5 87 61 80 61 H 65 H 81 C 88 61 93 65.5 93 71.5 C 93 78 88 83 80 83 H 65 V 42" fill="none" stroke="url(#ubGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

  <!-- Terminal Prompt Accent >_ -->
  <path d="M 36 34 L 42 38 L 36 42" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
